# Construit l'ISO Arch Surface dans un conteneur Arch Linux.
# - Pull request : build de contrôle, ISO dispo en artefact 3 jours (onglet Actions)
# - Lancement manuel (Actions > Construire l'ISO > Run workflow) :
#     champ « version » vide  → ISO en artefact 3 jours
#     champ « version » rempli (ex. 1.1.0) → crée le tag et publie la Release
# - Tag de version (ex. 1.1.0 ou v1.1.0) : publie l'ISO + SHA256SUMS dans une Release GitHub
#   (tag avec un tiret, ex. 1.2.0-beta1 → pré-release)
name: Construire l'ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 1.1.0, tiret = pré-release). Vide = simple build de contrôle"
        required: false
        default: ""
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  push:
    tags: ['v*', '[0-9]*']

permissions:
  contents: write

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Paquets de build
        run: pacman -Syu --noconfirm --needed archiso git

      - uses: actions/checkout@v6

      - name: Construction de l'ISO
        run: bash build.sh

      - name: Somme de contrôle
        run: |
          cd out
          sha256sum *.iso > SHA256SUMS
          ls -lh
          cat SHA256SUMS

      - name: Artefact (contrôle)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.version == '')
        uses: actions/upload-artifact@v6
        with:
          name: arch-surface-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          retention-days: 3

      - name: Release GitHub
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            out/*.iso
            out/SHA256SUMS
          prerelease: ${{ contains(inputs.version || github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ISO Arch Linux + KDE Plasma pour Surface Go 2.
            Flasher : `sudo dd if=arch-surface-*.iso of=/dev/sdX bs=4M status=progress oflag=sync` (vérifie /dev/sdX avec lsblk), ou Ventoy.
            Installation : boot USB (Volume Bas + Power), puis `install-surface`. Détails dans le README.
